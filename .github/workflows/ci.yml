name: CI

on:
  push:
    branches: ["main", "feat/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archaeo-lidar-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Micromamba with geospatial stack
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: archaeo-ci
          create-args: >-
            -c conda-forge
            python=3.11
            gdal
            pdal
            python-pdal
            rasterio
            geopandas
            shapely
            pyproj
            numpy
            scipy
            matplotlib-base
            scikit-learn

      - name: Install Python & dev dependencies
        shell: bash -el {0}
        run: |
          pip install --no-cache-dir \
            "fastmcp>=0.4.0" \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.2.0" \
            opencv-python-headless \
            httpx \
            "pystac-client>=0.9.0" \
            "planetary-computer>=1.0.0" \
            "boto3>=1.34.0" \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.23.0" \
            "ruff>=0.6.0"
          pip install --no-cache-dir --no-deps -e .

      - name: Lint with ruff
        shell: bash -el {0}
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Run pytest suite
        shell: bash -el {0}
        run: pytest -v
