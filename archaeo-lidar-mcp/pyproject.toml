[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archaeo-lidar-mcp"
version = "0.1.0"
description = "Servidor FastMCP para detección autónoma de sitios arqueológicos en Argentina mediante LiDAR, microtopografía (SLRM/Hillshade), inspección visual y validación espacial/académica."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ArchaeoLiDAR-AR Team" }
]
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pdal",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "opencv-python-headless",
    "numpy",
    "scipy",
    "matplotlib",
    "httpx",
    "pystac-client>=0.9.0",
    "planetary-computer>=1.0.0",
    "boto3>=1.34.0",
    "scikit-learn>=1.4.0",
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
